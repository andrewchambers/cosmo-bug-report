name: Reproduce
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    name: Latest published toolchain / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch latest published Cosmopolitan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cosmocc artifacts
          gh api repos/jart/cosmopolitan/releases/latest > artifacts/release.json
          curl -fLsS --retry 3 https://cosmo.zip/pub/cosmocc/cosmocc.zip -o /tmp/cosmocc.zip
          shasum -a 256 /tmp/cosmocc.zip | tee artifacts/toolchain.sha256
          unzip -q /tmp/cosmocc.zip -d .cosmocc
          echo "$PWD/.cosmocc/bin" >> "$GITHUB_PATH"
          uname -a | tee artifacts/host.txt
      - name: Build default and tiny variants directly with cosmocc
        run: |
          cosmocc --version | tee artifacts/compiler.txt
          cosmocc -Os -Wall -Wextra repro.c -o artifacts/release-default.com
          cosmocc -Os -Wall -Wextra -mtiny repro.c -o artifacts/release-tiny.com
      - name: Run both variants ten times
        run: python3 run.py artifacts/release-default.com artifacts/release-tiny.com
      - name: Preserve results even when the reproducer crashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: |
            artifacts/
            results.json
          retention-days: 30
