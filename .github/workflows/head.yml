name: Current upstream source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jart/cosmopolitan
          ref: master
          path: upstream
          persist-credentials: false
      - name: Record source revision and build both runtimes from source
        run: |
          mkdir -p artifacts
          git -C upstream log -1 --format=fuller | tee artifacts/source.txt
          cp repro.c upstream/examples/cosmo_bug_repro.c
          for variant in default tiny; do
            mode=$variant
            if [ "$variant" = default ]; then mode=; fi
            make -C upstream -j2 "MODE=$mode" \
              EXAMPLES_FILES=examples/cosmo_bug_repro.c \
              EXAMPLES_DIRECTDEPS=LIBC_THREAD \
              "o/$mode/examples/cosmo_bug_repro" \
              > "artifacts/build-$variant.log" 2>&1 || {
                tail -100 "artifacts/build-$variant.log"
                exit 1
              }
            cp "upstream/o/$mode/examples/cosmo_bug_repro" "artifacts/head-$variant.com"
          done
      - name: Linux control
        run: python3 run.py artifacts/head-default.com artifacts/head-tiny.com
      - name: Preserve source-built binaries and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-build
          path: |
            artifacts/
            results.json
          retention-days: 30
  macos:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-build
          path: downloaded
      - name: Run source-built binaries on Intel macOS
        run: python3 run.py downloaded/artifacts/head-default.com downloaded/artifacts/head-tiny.com
      - name: Preserve results even when the reproducer crashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-macos-results
          path: results.json
          retention-days: 30
