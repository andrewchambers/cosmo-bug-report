name: Diagnose released tiny runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the failing release
        run: |
          mkdir -p .cosmocc artifacts
          curl -fLsS --retry 3 https://cosmo.zip/pub/cosmocc/cosmocc-4.0.2.zip -o /tmp/cosmocc.zip
          echo '85b8c37a406d862e656ad4ec14be9f6ce474c1b436b9615e91a55208aced3f44  /tmp/cosmocc.zip' | shasum -a 256 -c -
          unzip -q /tmp/cosmocc.zip -d .cosmocc
          echo "$PWD/.cosmocc/bin" >> "$GITHUB_PATH"
      - name: Build unmodified and instrumented cases
        run: |
          cosmocc -g -Os -mtiny repro.c -o artifacts/repro.com
          cosmocc -g -Os -mtiny debug/sigsys.c -o artifacts/sigsys.com
          /bin/sh .cosmocc/bin/assimilate -x -m -o artifacts/repro.macho artifacts/repro.com
      - name: Capture the failure and debugger registers
        run: python3 debug/capture.py
      - name: Preserve debug evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnosis
          path: artifacts/
          retention-days: 30
